# LikeCleaner backend on the home server (DECISIONS 65, docs/DEPLOY_PLAN.md).
# GitHub Actions copies this file and .env (Secret ENV_PROD) into /home/kknaks/likecleaner, then runs:
#   docker compose --env-file .env -f docker-compose.prod.yml pull && ... up -d
services:
  api:
    image: ghcr.io/stronghajin/likecleaner-api:${IMAGE_TAG:-latest}
    container_name: likecleaner-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "48200:8000" # Nginx Proxy Manager: likecleaner-api.kknaks.cloud -> this port
    volumes:
      - ./data:/app/data # SQLite DB stays on the server across deploys
      - ./backups:/app/backups # daily copies (python -m scripts.backup), 14 days
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
